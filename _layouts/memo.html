---
{%- comment -%} Memos are published as PDFs only: each memo's web address forwards to its PDF. {%- endcomment -%}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
  <meta http-equiv="refresh" content="0; url={{ page.pdf | default: '/memos/' }}">
  <link rel="canonical" href="{{ page.pdf | default: '/memos/' }}">
</head>
<body>
  <p><a href="{{ page.pdf | default: '/memos/' }}">{{ page.title }} (PDF)</a></p>
</body>
</html>
